<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar no Admin | Cine Cruzeiro</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #060a12;
        --panel: #0b132b;
        --muted: #93a4bd;
        --text: #f8fafc;
        --gold: #facc15;
        --blue: #2563eb;
        --danger: #fb7185;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(37, 99, 235, .22), transparent 36%), var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, calc(100vw - 32px));
        padding: 28px;
        border-radius: 24px;
        background: rgba(11, 19, 43, .92);
        box-shadow: 0 24px 80px rgba(0, 0, 0, .38);
      }
      img { width: 120px; height: auto; display: block; margin-bottom: 22px; }
      h1 { margin: 0; font-size: 26px; line-height: 1.1; }
      p { margin: 10px 0 24px; color: var(--muted); font-size: 14px; line-height: 1.55; }
      label { display: grid; gap: 8px; margin-top: 14px; font-size: 12px; font-weight: 800; color: #bfdbfe; }
      input {
        width: 100%;
        min-height: 46px;
        border: 1px solid rgba(148, 163, 184, .28);
        border-radius: 8px;
        background: rgba(15, 23, 42, .92);
        color: var(--text);
        padding: 13px 14px;
        outline: none;
        box-shadow: inset 0 1px rgba(255,255,255,.06), 0 12px 28px rgba(0,0,0,.16);
      }
      input:hover { border-color: rgba(203, 213, 225, .4); background: rgba(18, 29, 49, .96); }
      input:focus { border-color: rgba(250, 204, 21, .82); box-shadow: inset 0 1px rgba(255,255,255,.08), 0 0 0 4px rgba(250,204,21,.12); }
      button {
        width: 100%;
        margin-top: 22px;
        border: 0;
        border-radius: 16px;
        padding: 14px 18px;
        background: var(--gold);
        color: #020617;
        font-weight: 950;
        cursor: pointer;
        transition: transform .2s, filter .2s;
      }
      button:hover { filter: brightness(1.05); }
      button:active { transform: scale(.99); }
      button:disabled { cursor: wait; opacity: .65; }
      .error { min-height: 20px; margin-top: 14px; color: var(--danger); font-size: 12px; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <img src="images/logo-display.webp" alt="Cine Cruzeiro" width="320" height="183" />
      <h1>Painel Cine Cruzeiro</h1>
      <p>Entre com uma conta autorizada para gerenciar programação, vendas, bomboniere e validação de ingressos.</p>
      <form id="loginForm">
        <label>
          E-mail
          <input id="email" type="email" autocomplete="username" required />
        </label>
        <label>
          Senha
          <input id="password" type="password" autocomplete="current-password" required />
        </label>
        <button id="submitButton" type="submit">Entrar no painel</button>
        <div id="error" class="error" role="status"></div>
      </form>
    </main>
    <script>
      const ADMIN_BASE = (() => {
        const pathname = window.location.pathname || "";
        const adminIndex = pathname.indexOf("/admin");
        return adminIndex > 0 ? pathname.slice(0, adminIndex) : "";
      })();
      const form = document.getElementById("loginForm");
      const button = document.getElementById("submitButton");
      const error = document.getElementById("error");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        error.textContent = "";
        try {
          const response = await fetch(`${ADMIN_BASE}/api/admin/login`, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: document.getElementById("email").value,
              password: document.getElementById("password").value
            })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error?.message || data.error || "Nao foi possivel entrar.");
          window.location.href = `${ADMIN_BASE}/admin`;
        } catch (err) {
          error.textContent = err.message;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
