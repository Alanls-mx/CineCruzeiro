name: Security regression

on:
  push:
  pull_request:

jobs:
  local-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:security:local
      - run: node --test tests/storage-image-sanitization.test.mjs
      - run: npm run test:ticket-security
      - run: node scripts/admin-two-factor-tests.js
      - run: npm run test:payment-metadata
      - run: npm run test:finance
      - run: npm run test:permissions
      - run: npm run test:seat-map
      - run: npm run lint
      - run: npm run build
